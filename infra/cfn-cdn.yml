AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SSCM Frontend — S3 + CloudFront
  React SPA 정적 호스팅 + CDN

# ============================================================
# Parameters
# ============================================================
Parameters:
  AlbDnsName:
    Type: String
    Description: "Backend ALB DNS (API 프록시용)"
    Default: "sscm-alb-942993728.ap-northeast-2.elb.amazonaws.com"

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # S3 Bucket — React 빌드 파일 저장
  # ----------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: sscm-frontend-static
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: sscm

  # ----------------------------------------------------------
  # S3 Bucket Policy — CloudFront만 접근 허용
  # ----------------------------------------------------------
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ----------------------------------------------------------
  # CloudFront Origin Access Control
  # ----------------------------------------------------------
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: sscm-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ----------------------------------------------------------
  # CloudFront Distribution
  # ----------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "SSCM Frontend CDN"
        DefaultRootObject: index.html
        PriceClass: PriceClass_200

        # S3 Origin (Frontend 정적 파일)
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ALBOrigin
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only

        # 기본: S3 (프론트엔드)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true

        # /api/* → ALB (백엔드)
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # AllViewer
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
          - PathPattern: "/ws/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE

        # React SPA — 404를 index.html로 리다이렉트 (클라이언트 라우팅)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

      Tags:
        - Key: Project
          Value: sscm

# ============================================================
# Outputs
# ============================================================
Outputs:
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: "CloudFront URL (https://xxxxx.cloudfront.net)"
    Export:
      Name: sscm-cloudfront-domain

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: "CloudFront Distribution ID (캐시 무효화에 사용)"
    Export:
      Name: sscm-cloudfront-id

  S3BucketName:
    Value: !Ref FrontendBucket
    Description: "Frontend S3 버킷 이름"
    Export:
      Name: sscm-frontend-bucket
